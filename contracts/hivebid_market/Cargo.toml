[package]
name = "hivebid_market"
version = "0.1.0"
edition = "2021"
description = "HiveBid market contract: task auction / escrow / payout / on-chain rating (RFC ROY_MARKET_PROTOCOL)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0" }
borsh = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-vm-runner = { version = "=0.38.0", default-features = false, features = ["prepare"] }
near-parameters = "=0.38.0"
near-primitives-core = "=0.38.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmparser = "=0.228.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
